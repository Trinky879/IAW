upstream backend_afornell {
    server afornell-apache:8016;
}

limit_req_zone $binary_remote_addr zone=zona_escudo_afornell:10m rate=3r/s;

server {
    listen 80;
    server_name docs.afornell-cloud.es intranet.fornell-tech.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name docs.afornell-cloud.es intranet.fornell-tech.internal;

    ssl_certificate /etc/nginx/certs/afornell.crt;
    ssl_certificate_key /etc/nginx/certs/afornell.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/afornell_ssl_access.log;
    error_log /var/log/nginx/afornell_ssl_error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        limit_req zone=zona_escudo_afornell burst=6 nodelay;
        limit_req_status 429;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://backend_afornell;
    }
}
