<VirtualHost *:8016>
    ServerName intranet.fornell-tech.internal
    DocumentRoot /var/www/fornell_internal
    ErrorLog ${APACHE_LOG_DIR}/fornell_internal_error.log
    CustomLog ${APACHE_LOG_DIR}/fornell_internal_access.log combined
    <Directory /var/www/fornell_internal>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Files "credenciales-afornell.cfg">
        Require all denied
    </Files>
</VirtualHost>
