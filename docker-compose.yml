services:
  afornell-apache:
    build: ./apache
    container_name: afornell-apache
    ports:
      - "127.0.0.1:8016:8016"
    networks:
      - red-afornell

  afornell-nginx:
    image: nginx:stable
    container_name: afornell-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - afornell-apache
    networks:
      - red-afornell

networks:
  red-afornell:
    driver: bridge
