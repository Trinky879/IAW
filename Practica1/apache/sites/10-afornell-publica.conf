<VirtualHost *:8016>
    ServerName docs.afornell-cloud.es
    DocumentRoot /var/www/afornell_public
    ErrorLog ${APACHE_LOG_DIR}/afornell_public_error.log
    CustomLog ${APACHE_LOG_DIR}/afornell_public_access.log combined
    <Directory /var/www/afornell_public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
